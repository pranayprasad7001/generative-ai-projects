model_list:

  - model_name: nemotron-3-ultra-550b-a55b
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_API_KEY
      api_base: os.environ/NVIDIA_API_BASE
      max_tokens: 16384
      rpm: 40

  - model_name: nvidia-glm-5.2
    litellm_params:
      model: nvidia_nim/z-ai/glm-5.2
      api_key: os.environ/NVIDIA_API_KEY
      api_base: os.environ/NVIDIA_API_BASE
      max_tokens: 16384
      rpm: 40

  - model_name: nemotron-3-nano
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      api_key: os.environ/NVIDIA_API_KEY
      api_base: os.environ/NVIDIA_API_BASE
      max_completion_tokens: 65536
      rpm: 40

  - model_name: gemini-embedding-2
    litellm_params:
      model: gemini/gemini-embedding-2
      api_key: os.environ/GOOGLE_API_KEY
      max_batch_size: 100
      rpm: 100
      tpm: 30000

router_settings:
  num_retries: 5
  timeout: 60
  fallbacks:
    - nemotron-3-ultra-550b-a55b: ["nvidia-glm-5.2"]
    - nemotron-3-nano: ["nvidia-glm-5.2"]

  enable_pre_call_checks: true
  optional_pre_call_checks:
    - enforce_model_rate_limits

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  cache: True
  cache_params:
    type: redis-semantic
    mode: default_off
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    similarity_threshold: 0.85
    ttl: 1800
    redis_semantic_cache_embedding_model: gemini-embedding-2