model_list:

  - model_name: gpt-oss-120b-groq
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

  - model_name: gpt-oss-20b-groq
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY

  - model_name: qwen3.6-27b-groq
    litellm_params:
      model: groq/qwen/qwen3.6-27b
      api_key: os.environ/GROQ_API_KEY

  - model_name: nvidia-glm-5.2
    litellm_params:
      model: nvidia_nim/z-ai/glm-5.2
      api_key: os.environ/NVIDIA_API_KEY
      api_base: os.environ/NVIDIA_API_BASE

  - model_name: cohere-embed
    litellm_params:
      model: cohere/embed-english-v3.0
      api_key: os.environ/COHERE_API_KEY

router_settings:
  num_retries: 2
  timeout: 30
  fallbacks:
    - nvidia-glm-5.2: ["gpt-oss-120b-groq", "gpt-oss-20b-groq"]

litellm_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  cache: True
  cache_params:
    type: redis-semantic
    mode: default_off
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    similarity_threshold: 0.85
    ttl: 1800
    redis_semantic_cache_embedding_model: cohere-embed